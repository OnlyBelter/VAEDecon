# VAEDecon Configuration File

data:
  data_dir: './datasets/'
  scaling_by_constant: true
  remove_low_var_genes: false
  force_reprocess: false
  scaling_factor: 20.0  #  Default scaling divisor when scaling_by_constant is True.
  min_var: 1.0  # Minimum variance threshold for gene filtering (if remove_low_var_genes is True).
  gene_mean_std_source: "sct_gep"  # "sct_gep" or "pooled_sc"
  gene_mean_std_sct_gep_file_path: ""  # Optional dedicated SCT .h5ad for gene mean/std when gene_mean_std_source is "sct_gep"
  pooled_sc_h5ad_path: ""  # Required when gene_mean_std_source is "pooled_sc"
  pooled_sc_cell_type_col: "cell_type"
  pooled_sc_cell_subtype_col: "cell_subtype"
  pooled_sc_sample_size: 1000
  pooled_sc_seed: 123
  # Training set, test set, and sct_gep_file (for finding true sampled GEPs).
  sct_file_path: [ './datasets/generated_sc_dataset_12ds_n_base100_all_subtypes/simu_bulk_exp_SCT_POS_N100_test_log2cpm1p.h5ad' ]
  simu_bulk_file_path: [ './datasets/simulated_bulk_cell_dataset_subtypes_all_range/segment_12ds_no_filtering_n_base100_median_gep/simu_bulk_exp_Mixed_N1K_segment_without_filtering_log2cpm1p.h5ad' ]
  # Optional multi-test-set layout for batch inference. The legacy single-test-set
  # fields above remain supported and also seed the first configured test set.
  test_sets:
    Test_set1:
      test_set_file_path: './datasets/simulated_bulk_cell_dataset_subtypes_all_range/segment_12ds_0.95_n_base100_19cancer_pca_0.9_median_gep/simu_bulk_exp_Test_set1_log2cpm1p.h5ad'
      sct_gep_file_path: './datasets/generated_sc_dataset_12ds_n_base100_all_subtypes/simu_bulk_exp_SCT_POS_N10K_log2cpm1p_25sct.h5ad'
      test_set_sample2cell_id_file_path: './datasets/simulated_bulk_cell_dataset_subtypes_all_range/segment_12ds_0.95_n_base100_19cancer_pca_0.9_median_gep/simu_bulk_exp_Test_set1_sampled_sc_cell_id.csv'
    Test_set2:
      test_set_file_path: './datasets/simulated_bulk_cell_dataset_subtypes_all_range/segment_12ds_alt_test/simu_bulk_exp_Test_set2_log2cpm1p.h5ad'
      sct_gep_file_path: './datasets/generated_sc_dataset_12ds_n_base100_all_subtypes/simu_bulk_exp_SCT_POS_N10K_log2cpm1p_25sct.h5ad'
      test_set_sample2cell_id_file_path: './datasets/simulated_bulk_cell_dataset_subtypes_all_range/segment_12ds_alt_test/simu_bulk_exp_Test_set2_sampled_sc_cell_id.csv'


training:
  output_dir: './output/vae'
  naming_postfix: 'my_experiment'
  learning_rate: 5.0e-5
  batch_size: 1024
  num_epochs: 1000
  n_early_stopping_patience: 15
  devices: 1
  device: 'auto'
  train_dataloader_num_workers: 0
  eval_dataloader_num_workers: 0
  optimizer_cls: 'AdamW'
  steps_saving: 0
  debug_model: false
  train_split: 0.8
  val_split: 0.2
  
  # ── Warmup settings (NEW) ──────────────────────────────────────
  warmup_epochs: 50              # epochs to ramp up from ~0 → peak lr
  gene_stat_weight_schedule: "linear"
  # schedule length in epochs and only applied to gene_mean_weight and gene_std_weight
  gene_stat_weight_schedule_epochs: 50
  gene_mean_weight_start: 0.0
  gene_mean_weight_end: 0.0
  gene_std_weight_start: 0.0
  gene_std_weight_end: 0.0
  prog_bar_metrics:
    - loss
    - kld
    - recon_loss_conv
    - low_mean_std_gene_loss
    - z_score_kl_loss
    - hierarchical_code_loss

  # Option A: Warmup + Cosine
  #Epoch:   0 ──── warmup_epochs ──────────────── num_epochs
  #                    │
  #         LinearLR   │   CosineAnnealingLR
  #         (warmup)   │   (T_max)
  #         ◄─────────►│◄──────────────────────────►
  # scheduler_cls: "WarmupCosine"
  # scheduler_params:
  #   T_max: 950  # Total number of epochs for cosine annealing (including warmup)
  #   eta_min: 1.0e-7

  #  Option B: Warmup + ReduceLROnPlateau  (comment out A, use this)
  scheduler_cls: "WarmupReduceOnPlateau"
  scheduler_params:
    patience: 10
    factor: 0.5
    min_lr: 1.0e-7
    verbose: true


model:
  ppi_file_path: './datasets/PPI/format_h_sapiens.csv'
  input_dim: [1, 17834]
  latent_dim: 10
  n_cell_types: 16
  encoder_hidden_dims: [2048, 1024, 1024, 512]
  decoder_hidden_dims: [512, 1024, 1024, 2048]
  encoder_dropout_rate: [0, 0.1, 0.1, 0]
  decoder_dropout_rate: [0, 0.1, 0.1, 0]
  fusion_hidden_dims: [512, 256]
  fusion_dropout_rate: [0.1, 0]
  encoders: ['EncoderResMLP']
  decoders: ['DecoderResMLP']
  predict_cell_prop: false  # Set to true to learn Dirichlet concentration parameters and output their mean as cell fractions.
  cell_prop_activation_function: 'softplus'  # 'softplus' keeps the Dirichlet workflow; 'sigmoid' predicts non-cancer cell types and fills cancer as the remainder; 'softmax' predicts all cell types directly.
  cancer_cell_type_name: 'Cancer Cells'  # Required when cell_prop_activation_function is 'sigmoid'.
  loss_coefficient:
    kld_p: 0.0  # Only valid for 'softplus'; keep 0 for 'sigmoid' and 'softmax'.
    cell_prop: 0  # Set > 0 to supervise known training fractions for any enabled cell-proportion activation mode.
    beta: 2
    gamma: 0.005
    attractor_weight: 0.0  # weight for the attractor loss (default 0.0)
    hierarchical_code_weight: 0.0
    # 'ave' means using the average mu and logvar across cell types, 'sep' means calculate kld for each cell type separately
    kld_type: 'ave'
    weighting_gene_by_exp: true
    weight_clamp_range: [0.2, 5]
    gene_mean_weight: 0
    gene_std_weight: 0
    z_score_kl_weight: 1.0
    low_mean_std_weight: 0  # weight for low mean/std genes to fit pre-calculated gene mean and std
    low_mean_threshold: 2.0
    low_std_threshold: 1.0
  gnn_n_genes: 12596
  gnn_inter_col_dim: 500
  gnn_embd_col_dim: 30
  gnn_lambda_cols: 1.0
  gnn_num_layers: 3
  gnn_drop_p: 0.25
  gene_hidden_dim: 10
  gnn_topk_attention: 1024
  using_positional_encoding: false
  mask_ratio: 0.4


evaluation:
  n_samples: 3
  visualize_n_sample: 3
  cell_prop_threshold: 0.005
  plot_cell_proportions: true
  plot_single_cell_gep: true
  plot_bulk_gep: true
  plot_latent_space: true
  n_neighbors: 15
  min_dist: 0.1
  figsize: [3.5, 3.5]
  rasterized: true
  show_metrics: true
  val_batch_size: 128
  figure_format: 'png'  # 'png', 'svg', or 'pdf'
  save_reconstructed_gep: false
  save_cell_type_specific_gep_metrics: false
  save_bulk_gep_input: true
  save_recon_bulk_gep_conv: true
  remove_low_var_genes: false
