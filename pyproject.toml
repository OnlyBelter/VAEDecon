# pyproject.toml

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "VAEDecon"
version = "0.3.2"
description = "Gene expression deconvolution by single cell generative model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "OnlyBelter", email = "onlybelter@outlook.com" },
]
maintainers = [
    { name = "OnlyBelter", email = "onlybelter@outlook.com" },
]
keywords = [
    "VAE",
    "scRNA-seq",
    "RNA-seq",
    "deconvolution",
    "tumor microenvironment",
    "bioinformatics",
    "computational biology",
]
classifiers = [
    "Intended Audience :: Science/Research",
#    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
dependencies = [
#    "tensorflow>=2.8.0",
#    "torch==2.6.0",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "scikit-learn==1.7.2",
    "anndata==0.8.0",
    "scanpy==1.11.5",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "numexpr==2.10.0",
    "scipy==1.16.3",
    "umap-learn==0.5.6",
    "matplotlib==3.10.7",
    "seaborn==0.13.2",
    "bbknn==1.5.1",
    "SciencePlots",
    "tables==3.9.2",
    "build==1.3.0",
    "sphinx==7.3.7",
    "myst-parser==4.0.1",
    "fsspec",
    "h5py==3.11.0",
    "huggingface_hub",
#    "sphinx_book_theme",
    "jinja2==3.0.3",
    "pydantic",
    "cloudpickle",
#    "pythae",
    "torchmetrics",
    "lightning==2.5.1",
    "torch-geometric==2.6.1",
    "networkx==3.5",
    "igraph==0.11.8",

#    'tensorrt',
#    "sphinx_rtd_theme"
]
#dynamic = ["version"]

[project.urls]
#Documentation = "https://deside.readthedocs.io/"
Homepage = "https://github.com/OnlyBelter/VAEDecon"
Source = "https://github.com/OnlyBelter/VAEDecon"
Tracker = "https://github.com/OnlyBelter/VAEDecon/issues"

[project.scripts]
vaedecon = "vaedecon.cli.main:main"

# Setuptools configuration
[tool.setuptools.packages.find]
where = ["."]
include = ["vaedecon*"]
exclude = ["tests*", "docs*", "examples*", "configs*"]  # Exclude configs and examples from the package

# https://realpython.com/pypi-publish-python-package/#version-your-package
[tool.bumpver]
current_version = "0.1.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
]
"setup.py" = [
    "{version}",
    "{pep440_version}",
]
"README.rst" = [
    "{version}",
    "{pep440_version}",
]
"README.md" = [
    "{version}",
    "{pep440_version}",
]

